[project]
name = "template-generation-explorer"
version = "0.1.0"
description = "Interactive Streamlit app for understanding the Template Generation design pattern"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.40",
    "pydantic-ai-slim[openai,google]>=1.0",
    "python-dotenv>=1.0",
    "pandas>=2.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
